name: Materialize Scopebox v0.1

on:
  push:
    branches:
      - build/scopebox-v0.1
    paths:
      - ".bootstrap/**"
      - ".github/workflows/materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > scopebox-src.b64
          base64 --decode scopebox-src.b64 > scopebox-src.tar.gz
          echo "330dc352c3f28233c0bf7bcaf93e93110a7784c336164724b93424bbcc8bda73  scopebox-src.tar.gz" | sha256sum --check -

      - name: Materialize repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .materialized
          mkdir .materialized
          tar -xzf scopebox-src.tar.gz -C .materialized
          cp -a .materialized/scopebox-v0.1/. .
          rm -rf .bootstrap .materialized scopebox-src.b64 scopebox-src.tar.gz
          rm -f .github/workflows/materialize.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit materialized project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes."
            exit 0
          fi
          git commit -m "Add Scopebox v0.1 prototype"
          git push origin HEAD:build/scopebox-v0.1
