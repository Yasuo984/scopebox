<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Scopebox launch board</title>
<desc id="desc">A launch board where the human frames writable fields and the agent requests a wider scope.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f7f2"/><stop offset="1" stop-color="#e8ebe4"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#283039" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="690" rx="30" fill="url(#bg)"/>
<g font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#1d2329">
  <g transform="translate(35 24)"><rect x="0" y="0" width="28" height="28" rx="8" fill="none" stroke="#283039" stroke-width="2"/><rect x="7" y="7" width="14" height="14" rx="4" fill="#8c93aa"/><text x="40" y="13" font-size="17" font-weight="700">Scopebox</text><text x="40" y="29" font-size="10" fill="#7b828a">Human-framed agent capability</text></g>
  <g transform="translate(35 75)" filter="url(#shadow)"><rect width="765" height="570" rx="24" fill="#fff" stroke="#d8dcd4"/><text x="28" y="34" font-size="11" letter-spacing="2" fill="#687079">SHARED LIVE PAGE</text><text x="28" y="70" font-size="34" font-weight="750">Launch Board</text><text x="700" y="35" font-size="10" fill="#687079">SCOPE</text><text x="700" y="58" font-size="21" font-weight="700">v1</text>
    <g transform="translate(26 90)"><rect width="713" height="108" rx="18" fill="#f0f1f8" stroke="#dfe2ee"/><rect x="18" y="18" width="38" height="38" rx="11" fill="#777f99"/><text x="37" y="43" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">B</text><text x="72" y="25" font-size="10" letter-spacing="1.6" fill="#687079">LAUNCH BRIEF</text><text x="72" y="50" font-size="18" font-weight="700">Tokyo preview launch</text><text x="72" y="73" font-size="12" fill="#555e67">Ready this board for a September 12 launch. Make the copy calm, specific, and concise.</text><text x="625" y="26" font-size="9" fill="#687079">TARGET</text><text x="625" y="48" font-size="13" font-weight="700">Sep 12, 2026</text></g>
    <text x="28" y="226" font-size="10" letter-spacing="1.7" fill="#687079">HUMAN CONTROL SURFACE</text><text x="28" y="253" font-size="22" font-weight="720">Frame the agent's write scope</text><text x="28" y="273" font-size="11" fill="#687079">Every field stays visible. Only framed fields become writable through WebMCP.</text>
    <g transform="translate(27 292)">
      <g><rect width="344" height="92" rx="15" fill="#fff" stroke="#d8dcd4"/><text x="16" y="24" font-size="12" font-weight="700">Product name</text><text x="16" y="57" font-size="15" font-weight="650">Kumo One</text><text x="278" y="24" font-size="9" fill="#858b91">READ</text></g>
      <g transform="translate(365)"><rect width="344" height="92" rx="15" fill="#f7f8fc" stroke="#747d99" stroke-width="2"/><text x="16" y="24" font-size="12" font-weight="700">Headline</text><text x="16" y="57" font-size="15" font-weight="650">Carry light. Move freely.</text><text x="276" y="24" font-size="9" fill="#5d6683">FRAMED</text></g>
      <g transform="translate(0 108)"><rect width="344" height="92" rx="15" fill="#f7f8fc" stroke="#747d99" stroke-width="2"/><text x="16" y="24" font-size="12" font-weight="700">Description</text><text x="16" y="51" font-size="13" font-weight="600">A quiet, lightweight carry</text><text x="16" y="68" font-size="13" font-weight="600">for city commutes and short trips.</text><text x="276" y="24" font-size="9" fill="#5d6683">FRAMED</text></g>
      <g transform="translate(365 108)"><rect width="344" height="92" rx="15" fill="#fff" stroke="#d8dcd4"/><text x="16" y="24" font-size="12" font-weight="700">Audience</text><text x="16" y="57" font-size="14" font-weight="600">Design-conscious city commuters</text><text x="278" y="24" font-size="9" fill="#858b91">READ</text></g>
    </g>
    <g transform="translate(27 510)"><rect width="713" height="40" rx="12" fill="#fbfaf5" stroke="#ded9ca"/><text x="16" y="17" font-size="9" letter-spacing="1.3" fill="#7d7563">HUMAN DECISION REQUIRED</text><text x="16" y="34" font-size="12" font-weight="650">The agent is asking for Launch date.</text><rect x="592" y="7" width="105" height="27" rx="9" fill="#737c98"/><text x="644" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Expand scope</text></g>
  </g>
  <g transform="translate(825 75)">
    <g filter="url(#shadow)"><rect width="340" height="292" rx="24" fill="#20262d"/><circle cx="311" cy="26" r="5" fill="#8992ad"/><text x="24" y="30" font-size="10" letter-spacing="1.6" fill="#aeb5bd">LIVE CAPABILITY SURFACE</text><text x="24" y="58" font-size="19" font-weight="700" fill="#fff">What the agent can do now</text><text x="24" y="82" font-size="10" fill="#aeb5bd">Tools change when the human frame changes.</text>
      <g transform="translate(20 103)" font-size="11" fill="#f8fafb"><rect width="300" height="40" rx="10" fill="#2a3139" stroke="#3b444e"/><text x="45" y="25">inspect_workspace</text><text x="263" y="25" font-size="9" fill="#adb4bc">READ</text><rect y="49" width="300" height="40" rx="10" fill="#2a3139" stroke="#3b444e"/><text x="45" y="74">inspect_active_scope</text><text x="263" y="74" font-size="9" fill="#adb4bc">READ</text><rect y="98" width="300" height="40" rx="10" fill="#353c49" stroke="#626d8b"/><text x="45" y="123">edit_scoped_fields</text><text x="258" y="123" font-size="9" fill="#d5d9e7">WRITE</text></g>
      <text x="24" y="271" font-size="10" fill="#aeb5bd">↻ Obsolete tools are removed as state changes.</text></g>
    <g transform="translate(0 316)" filter="url(#shadow)"><rect width="340" height="194" rx="24" fill="#fff" stroke="#d8dcd4"/><text x="22" y="28" font-size="10" letter-spacing="1.6" fill="#687079">FIELD ACCESS</text><text x="22" y="54" font-size="17" font-weight="700">Read everywhere. Write inside the frame.</text><g font-size="11"><text x="22" y="87">Product name</text><text x="284" y="87" fill="#747c86">● READ</text><text x="22" y="113">Headline</text><text x="277" y="113" fill="#5d6683">● WRITE</text><text x="22" y="139">Description</text><text x="277" y="139" fill="#5d6683">● WRITE</text><text x="22" y="165">Launch date</text><text x="284" y="165" fill="#747c86">● READ</text></g></g>
  </g>
  <text x="38" y="674" font-size="11" font-weight="650">The agent can only touch what the human frames.</text><text x="1002" y="674" font-size="10" fill="#767e86">Scopebox v0.1</text>
</g></svg>